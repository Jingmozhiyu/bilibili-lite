services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bilibili_lite
      POSTGRES_USER: bilibili
      POSTGRES_PASSWORD: bilibili
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilibili -d bilibili_lite"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
