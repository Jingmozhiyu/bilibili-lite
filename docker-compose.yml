services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bilibili_lite
      POSTGRES_USER: bilibili
      POSTGRES_PASSWORD: bilibili
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilibili -d bilibili_lite"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: bilibili-lite-local-meilisearch-master-key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  meilisearch-data:
