server:
  http:
    network: ${SERVER_HTTP_NETWORK}
    addr: ${SERVER_HTTP_ADDR}
    timeout: ${SERVER_HTTP_TIMEOUT}
  grpc:
    network: ${SERVER_GRPC_NETWORK}
    addr: ${SERVER_GRPC_ADDR}
    timeout: ${SERVER_GRPC_TIMEOUT}
data:
  database:
    driver: ${DATABASE_DRIVER}
    source: ${DATABASE_SOURCE}
  media:
    storage_dir: ${MEDIA_STORAGE_DIR}
    upload_idle_timeout: ${MEDIA_UPLOAD_IDLE_TIMEOUT}
    transcode_timeout: ${MEDIA_TRANSCODE_TIMEOUT}
    max_upload_bytes: ${MEDIA_MAX_UPLOAD_BYTES}
    max_cover_bytes: ${MEDIA_MAX_COVER_BYTES}
    max_user_storage_bytes: ${MEDIA_MAX_USER_STORAGE_BYTES}
    transcode_workers: ${MEDIA_TRANSCODE_WORKERS}
    transcode_poll_interval: ${MEDIA_TRANSCODE_POLL_INTERVAL}
  search:
    address: ${SEARCH_ADDRESS}
    api_key: ${SEARCH_API_KEY}
    video_index: ${SEARCH_VIDEO_INDEX}
    retry_interval: ${SEARCH_RETRY_INTERVAL}
  redis:
    address: ${REDIS_ADDRESS}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE}
    video_ranking_key: ${REDIS_VIDEO_RANKING_KEY}
  seed:
    enabled: ${SEED_ENABLED}
    password: ${SEED_PASSWORD}
auth:
  issuer: ${AUTH_ISSUER}
  secret: ${AUTH_SECRET}
  access_ttl: ${AUTH_ACCESS_TTL}
  refresh_ttl: ${AUTH_REFRESH_TTL}
