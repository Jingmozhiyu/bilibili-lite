syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bilibili-lite/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "user.v1";

service UserService {
  rpc GetMe(GetMeRequest) returns (User) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
    };
  }

  rpc UpdateMe(UpdateMeRequest) returns (User) {
    option (google.api.http) = {
      patch: "/api/v1/users/me"
      body: "*"
    };
  }

  rpc UpdateMyAvatar(google.api.HttpBody) returns (User) {
    option (google.api.http) = {
      put: "/api/v1/users/me/avatar"
      body: "*"
    };
  }

  rpc DeleteMyAvatar(DeleteMyAvatarRequest) returns (User) {
    option (google.api.http) = {
      delete: "/api/v1/users/me/avatar"
    };
  }

  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}"
    };
  }

  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc Refresh(RefreshRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }
}

message User {
  uint64 id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  string bio = 5;
  int64 coin_balance = 6;
  bool is_admin = 7;
}

message GetUserRequest {
  uint64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetMeRequest {}

message UpdateMeRequest {
  string display_name = 1 [(google.api.field_behavior) = REQUIRED];
  reserved 2;
  string bio = 3;
}

message DeleteMyAvatarRequest {}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message LoginReply {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  User user = 3;
  string refresh_token = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
}

message LogoutRequest {
  // Used by gRPC clients and as an HTTP fallback when no Bearer header is set.
  string access_token = 1;
}

message RefreshRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}
