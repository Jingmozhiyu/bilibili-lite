syntax = "proto3";

package video.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bilibili-lite/api/video/v1;v1";
option java_multiple_files = true;
option java_package = "video.v1";
option java_outer_classname = "VideoProto";

service VideoService {
  rpc ListVideos(ListVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {
      get: "/api/v1/videos"
    };
  }

  rpc ListUserVideos(ListUserVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}/videos"
    };
  }

  rpc GetVideo(GetVideoRequest) returns (Video) {
    option (google.api.http) = {
      get: "/api/v1/videos/{bvid}"
    };
  }

  rpc GetVideoPlay(GetVideoPlayRequest) returns (VideoPlay) {
    option (google.api.http) = {
      get: "/api/v1/videos/{bvid}/play"
    };
  }

  rpc GetVideoLike(GetVideoLikeRequest) returns (VideoLike) {
    option (google.api.http) = {
      get: "/api/v1/videos/{bvid}/like"
    };
  }

  rpc LikeVideo(LikeVideoRequest) returns (VideoLike) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/like"
    };
  }

  rpc UnlikeVideo(UnlikeVideoRequest) returns (VideoLike) {
    option (google.api.http) = {
      delete: "/api/v1/videos/{bvid}/like"
    };
  }

  rpc GetVideoUploadStatus(GetVideoUploadStatusRequest) returns (VideoUploadStatus) {
    option (google.api.http) = {
      get: "/api/v1/videos/{bvid}/upload-status"
    };
  }

  rpc PublishVideo(PublishVideoRequest) returns (Video) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/publish"
      body: "*"
    };
  }

  rpc DeleteVideo(DeleteVideoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/videos/{bvid}"
    };
  }

  rpc StartVideoView(StartVideoViewRequest) returns (VideoViewSession) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/view-sessions"
      body: "*"
    };
  }

  rpc CompleteVideoView(CompleteVideoViewRequest) returns (VideoViewResult) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/view-sessions/{session_id}:complete"
      body: "*"
    };
  }
}

enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  VIDEO_STATUS_PROCESSING = 1;
  VIDEO_STATUS_READY = 2;
  VIDEO_STATUS_PUBLISHED = 3;
  VIDEO_STATUS_FAILED = 4;
  VIDEO_STATUS_DELETED = 5;
}

message Video {
  string bvid = 1;
  string title = 2;
  string description = 3;
  string owner_name = 4;
  string owner_avatar_url = 5;
  string cover_url = 6;
  int64 duration_seconds = 7;
  int64 view_count = 8;
  int64 danmaku_count = 9;
  int64 like_count = 10;
  int64 coin_count = 11;
  int64 favorite_count = 12;
  int64 share_count = 13;
  google.protobuf.Timestamp publish_time = 14;
  repeated string tags = 15;
  uint64 owner_id = 16;
  VideoStatus status = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

message ListVideosRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListUserVideosRequest {
  uint64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
}

message ListVideosReply {
  repeated Video videos = 1;
  string next_page_token = 2;
}

message VideoPlay {
  string bvid = 1;
  repeated VideoStream streams = 2;
  DanmakuConfig danmaku = 3;
}

message VideoStream {
  string id = 1;
  string label = 2;
  string codec = 3;
  string mime_type = 4;
  string url = 5;
  int32 width = 6;
  int32 height = 7;
  int32 bandwidth = 8;
  bool default_stream = 9;
}

message DanmakuConfig {
  bool enabled = 1;
  string format = 2;
  repeated DanmakuItem items = 3;
}

message DanmakuItem {
  double time_seconds = 1;
  string text = 2;
  string color = 3;
}

message GetVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetVideoPlayRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetVideoLikeRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message LikeVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnlikeVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message VideoLike {
  string bvid = 1;
  bool liked = 2;
  int64 like_count = 3;
}

message GetVideoUploadStatusRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message VideoUploadStatus {
  string bvid = 1;
  VideoStatus status = 2;
  string failure_reason = 3;
  string manifest_url = 4;
  string cover_url = 5;
}

message PublishVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  repeated string tags = 4;
}

message DeleteVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message StartVideoViewRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message VideoViewSession {
  string session_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

message CompleteVideoViewRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message VideoViewResult {
  bool counted = 1;
  int64 view_count = 2;
  int32 remaining_today = 3;
  google.protobuf.Timestamp next_eligible_at = 4;
}
