syntax = "proto3";

package video.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bilibili-lite/api/video/v1;v1";
option java_multiple_files = true;
option java_outer_classname = "VideoProto";
option java_package = "video.v1";

service VideoService {
  rpc ListVideos(ListVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/api/v1/videos"};
  }

  rpc ListRecommendedVideos(ListRecommendedVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/api/v1/videos/recommended"};
  }

  rpc SearchVideos(SearchVideosRequest) returns (SearchVideosReply) {
    option (google.api.http) = {get: "/api/v1/search/videos"};
  }

  rpc ListUserVideos(ListUserVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/api/v1/users/{user_id}/videos"};
  }

  rpc GetVideo(GetVideoRequest) returns (Video) {
    option (google.api.http) = {get: "/api/v1/videos/{bvid}"};
  }

  rpc GetVideoPlay(GetVideoPlayRequest) returns (VideoPlay) {
    option (google.api.http) = {get: "/api/v1/videos/{bvid}/play"};
  }

  rpc LikeVideo(LikeVideoRequest) returns (VideoLike) {
    option (google.api.http) = {post: "/api/v1/videos/{bvid}/like"};
  }

  rpc UnlikeVideo(UnlikeVideoRequest) returns (VideoLike) {
    option (google.api.http) = {delete: "/api/v1/videos/{bvid}/like"};
  }

  rpc GetVideoEngagement(GetVideoEngagementRequest) returns (VideoEngagement) {
    option (google.api.http) = {get: "/api/v1/videos/{bvid}/engagement"};
  }

  rpc FavoriteVideo(FavoriteVideoRequest) returns (VideoEngagement) {
    option (google.api.http) = {post: "/api/v1/videos/{bvid}/favorite"};
  }

  rpc UnfavoriteVideo(UnfavoriteVideoRequest) returns (VideoEngagement) {
    option (google.api.http) = {delete: "/api/v1/videos/{bvid}/favorite"};
  }

  rpc CoinVideo(CoinVideoRequest) returns (VideoEngagement) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/coin"
      body: "*"
    };
  }

  rpc ShareVideo(ShareVideoRequest) returns (VideoShare) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/shares"
      body: "*"
    };
  }

  rpc ListMyLikedVideos(ListVideoHistoryRequest) returns (ListVideoHistoryReply) {
    option (google.api.http) = {get: "/api/v1/users/me/video-likes"};
  }

  rpc ListMyFavoriteVideos(ListVideoHistoryRequest) returns (ListVideoHistoryReply) {
    option (google.api.http) = {get: "/api/v1/users/me/video-favorites"};
  }

  rpc ListMyCoinedVideos(ListVideoHistoryRequest) returns (ListVideoHistoryReply) {
    option (google.api.http) = {get: "/api/v1/users/me/video-coins"};
  }

  rpc ListMyWatchHistory(ListVideoHistoryRequest) returns (ListVideoHistoryReply) {
    option (google.api.http) = {get: "/api/v1/users/me/watch-history"};
  }

  rpc CreateDanmaku(CreateDanmakuRequest) returns (DanmakuItem) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/danmakus"
      body: "*"
    };
  }

  rpc DeleteDanmaku(DeleteDanmakuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/videos/{bvid}/danmakus/{danmaku_id}"};
  }

  rpc ListVideoComments(ListVideoCommentsRequest) returns (ListVideoCommentsReply) {
    option (google.api.http) = {get: "/api/v1/videos/{bvid}/comments"};
  }

  rpc ListVideoCommentReplies(ListVideoCommentRepliesRequest) returns (ListVideoCommentsReply) {
    option (google.api.http) = {get: "/api/v1/videos/{bvid}/comments/{root_comment_id}/replies"};
  }

  rpc CreateVideoComment(CreateVideoCommentRequest) returns (VideoComment) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/comments"
      body: "*"
    };
  }

  rpc DeleteVideoComment(DeleteVideoCommentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/videos/{bvid}/comments/{comment_id}"};
  }

  rpc LikeVideoComment(LikeVideoCommentRequest) returns (VideoCommentInteraction) {
    option (google.api.http) = {post: "/api/v1/videos/{bvid}/comments/{comment_id}/like"};
  }

  rpc UnlikeVideoComment(UnlikeVideoCommentRequest) returns (VideoCommentInteraction) {
    option (google.api.http) = {delete: "/api/v1/videos/{bvid}/comments/{comment_id}/like"};
  }

  rpc ListMyVideoComments(ListVideoHistoryRequest) returns (ListVideoCommentHistoryReply) {
    option (google.api.http) = {get: "/api/v1/users/me/video-comments"};
  }

  rpc GetVideoUploadStatus(GetVideoUploadStatusRequest) returns (VideoUploadStatus) {
    option (google.api.http) = {get: "/api/v1/videos/{bvid}/upload-status"};
  }

  rpc SubmitVideoForReview(SubmitVideoForReviewRequest) returns (Video) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/submit-review"
      body: "*"
    };
  }

  rpc DeleteVideo(DeleteVideoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/videos/{bvid}"};
  }

  rpc StartVideoView(StartVideoViewRequest) returns (VideoViewSession) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/view-sessions"
      body: "*"
    };
  }

  rpc CompleteVideoView(CompleteVideoViewRequest) returns (VideoViewResult) {
    option (google.api.http) = {
      post: "/api/v1/videos/{bvid}/view-sessions/{session_id}:complete"
      body: "*"
    };
  }

  rpc ListAdminVideos(ListAdminVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/api/v1/admin/videos"};
  }

  rpc ListPendingReviewVideos(ListPendingReviewVideosRequest) returns (ListVideosReply) {
    option (google.api.http) = {get: "/api/v1/admin/videos/reviews"};
  }

  rpc GetAdminVideo(GetAdminVideoRequest) returns (Video) {
    option (google.api.http) = {get: "/api/v1/admin/videos/{bvid}"};
  }

  rpc GetReviewVideoPlay(GetReviewVideoPlayRequest) returns (VideoPlay) {
    option (google.api.http) = {get: "/api/v1/admin/videos/{bvid}/play"};
  }

  rpc ApproveVideo(ApproveVideoRequest) returns (Video) {
    option (google.api.http) = {
      post: "/api/v1/admin/videos/{bvid}/approve"
      body: "*"
    };
  }

  rpc RejectVideo(RejectVideoRequest) returns (Video) {
    option (google.api.http) = {
      post: "/api/v1/admin/videos/{bvid}/reject"
      body: "*"
    };
  }

  rpc TakeDownVideo(TakeDownVideoRequest) returns (Video) {
    option (google.api.http) = {
      post: "/api/v1/admin/videos/{bvid}/take-down"
      body: "*"
    };
  }

  rpc DeleteAdminVideo(DeleteAdminVideoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/admin/videos/{bvid}"};
  }
}

enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  VIDEO_STATUS_PROCESSING = 1;
  VIDEO_STATUS_READY = 2;
  VIDEO_STATUS_PENDING_REVIEW = 3;
  VIDEO_STATUS_PUBLISHED = 4;
  VIDEO_STATUS_REJECTED = 5;
  VIDEO_STATUS_FAILED = 6;
  VIDEO_STATUS_DELETED = 7;
}

enum VideoSearchOrder {
  VIDEO_SEARCH_ORDER_UNSPECIFIED = 0;
  VIDEO_SEARCH_ORDER_RELEVANCE = 1;
  VIDEO_SEARCH_ORDER_MOST_VIEWED = 2;
  VIDEO_SEARCH_ORDER_LATEST = 3;
  VIDEO_SEARCH_ORDER_MOST_DANMAKU = 4;
  VIDEO_SEARCH_ORDER_MOST_FAVORITED = 5;
}

message Video {
  string bvid = 1;
  string title = 2;
  string description = 3;
  string owner_name = 4;
  string owner_avatar_url = 5;
  string cover_url = 6;
  int64 duration_seconds = 7;
  int64 view_count = 8;
  int64 danmaku_count = 9;
  int64 like_count = 10;
  int64 coin_count = 11;
  int64 favorite_count = 12;
  int64 share_count = 13;
  google.protobuf.Timestamp publish_time = 14;
  repeated string tags = 15;
  uint64 owner_id = 16;
  VideoStatus status = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  int64 comment_count = 20;
  string review_reason = 21;
  google.protobuf.Timestamp submitted_at = 22;
  google.protobuf.Timestamp reviewed_at = 23;
}

message ListVideosRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListRecommendedVideosRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListUserVideosRequest {
  uint64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
}

message ListVideosReply {
  repeated Video videos = 1;
  string next_page_token = 2;
}

message SearchVideosRequest {
  string query = 1 [(google.api.field_behavior) = REQUIRED];
  VideoSearchOrder order = 2;
  uint64 owner_id = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message SearchVideosReply {
  repeated Video videos = 1;
  string next_page_token = 2;
  int64 total_hits = 3;
  int64 processing_time_ms = 4;
}

message VideoPlay {
  string bvid = 1;
  repeated VideoStream streams = 2;
  DanmakuConfig danmaku = 3;
}

message VideoStream {
  string id = 1;
  string label = 2;
  string codec = 3;
  string mime_type = 4;
  string url = 5;
  int32 width = 6;
  int32 height = 7;
  int32 bandwidth = 8;
  bool default_stream = 9;
}

message DanmakuConfig {
  bool enabled = 1;
  string format = 2;
  repeated DanmakuItem items = 3;
}

message DanmakuItem {
  double time_seconds = 1;
  string text = 2;
  string color = 3;
  uint64 id = 4;
  uint64 user_id = 5;
  string user_name = 6;
  google.protobuf.Timestamp created_at = 7;
}

message GetVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetVideoPlayRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message LikeVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnlikeVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message VideoLike {
  string bvid = 1;
  bool liked = 2;
  int64 like_count = 3;
}

message GetVideoEngagementRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message FavoriteVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnfavoriteVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message CoinVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  int32 target_amount = 2 [(google.api.field_behavior) = REQUIRED];
}

message ShareVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string request_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message VideoEngagement {
  string bvid = 1;
  bool liked = 2;
  bool favorited = 3;
  int32 my_coin_amount = 4;
  int64 like_count = 5;
  int64 favorite_count = 6;
  int64 coin_count = 7;
  int64 share_count = 8;
  int64 coin_balance = 9;
}

message VideoShare {
  string bvid = 1;
  int64 share_count = 2;
}

message ListVideoHistoryRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message VideoHistoryItem {
  Video video = 1;
  google.protobuf.Timestamp interacted_at = 2;
  int32 coin_amount = 3;
}

message ListVideoHistoryReply {
  repeated VideoHistoryItem items = 1;
  string next_page_token = 2;
}

message CreateDanmakuRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  double time_seconds = 2;
  string text = 3 [(google.api.field_behavior) = REQUIRED];
  string color = 4;
}

message DeleteDanmakuRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 danmaku_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message VideoComment {
  uint64 id = 1;
  string bvid = 2;
  uint64 user_id = 3;
  string user_name = 4;
  string user_avatar_url = 5;
  string content = 6;
  google.protobuf.Timestamp created_at = 7;
  uint64 root_id = 8;
  uint64 parent_id = 9;
  uint64 reply_to_user_id = 10;
  string reply_to_user_name = 11;
  int64 like_count = 12;
  bool liked = 13;
  int64 reply_count = 14;
  bool deleted = 15;
}

message ListVideoCommentsRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
}

message ListVideoCommentsReply {
  repeated VideoComment comments = 1;
  string next_page_token = 2;
}

message ListVideoCommentRepliesRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 root_comment_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 3;
  string page_token = 4;
}

message CreateVideoCommentRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string content = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 parent_comment_id = 3;
}

message DeleteVideoCommentRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 comment_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message LikeVideoCommentRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 comment_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message UnlikeVideoCommentRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 comment_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message VideoCommentInteraction {
  uint64 comment_id = 1;
  bool liked = 2;
  int64 like_count = 3;
}

message VideoCommentHistoryItem {
  Video video = 1;
  VideoComment comment = 2;
}

message ListVideoCommentHistoryReply {
  repeated VideoCommentHistoryItem items = 1;
  string next_page_token = 2;
}

message GetVideoUploadStatusRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message VideoUploadStatus {
  string bvid = 1;
  VideoStatus status = 2;
  string failure_reason = 3;
  string manifest_url = 4;
  string cover_url = 5;
}

message SubmitVideoForReviewRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  repeated string tags = 4;
}

message DeleteVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message StartVideoViewRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message VideoViewSession {
  string session_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

message CompleteVideoViewRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message VideoViewResult {
  bool counted = 1;
  int64 view_count = 2;
  int32 remaining_today = 3;
  google.protobuf.Timestamp next_eligible_at = 4;
}

message ListAdminVideosRequest {
  string status = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
}

message ListPendingReviewVideosRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message GetAdminVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetReviewVideoPlayRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message ApproveVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
}

message RejectVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

message TakeDownVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteAdminVideoRequest {
  string bvid = 1 [(google.api.field_behavior) = REQUIRED];
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}
