syntax = "proto3";
package kratos.api;

import "google/protobuf/duration.proto";

option go_package = "bilibili-lite/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  reserved 2;

  message Database {
    string driver = 1;
    string source = 2;
  }
  Database database = 1;
  Media media = 3;
  Search search = 4;

  message Media {
    string storage_dir = 1;
    google.protobuf.Duration upload_idle_timeout = 2;
    google.protobuf.Duration transcode_timeout = 3;
    int64 max_upload_bytes = 4;
    int64 max_cover_bytes = 5;
    int64 max_user_storage_bytes = 6;
    int32 transcode_workers = 7;
    google.protobuf.Duration transcode_poll_interval = 8;
  }

  message Search {
    string address = 1;
    string api_key = 2;
    string video_index = 3;
    google.protobuf.Duration retry_interval = 4;
  }

  message Redis {
    string address = 1;
    string password = 2;
    int32 database = 3;
    string video_ranking_key = 4;
    string user_rate_limit_key_prefix = 5;
  }
  Redis redis = 5;

  message Seed {
    bool enabled = 1;
    string password = 2;
  }
  Seed seed = 6;
}

message Auth {
  string issuer = 1;
  string secret = 2;
  google.protobuf.Duration access_ttl = 3;
  google.protobuf.Duration refresh_ttl = 4;
}
