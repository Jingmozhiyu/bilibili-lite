syntax = "proto3";
package kratos.api;

option go_package = "bilibili-lite/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
	reserved 2;

	message Database {
	  string driver = 1;
	  string source = 2;
	}
	Database database = 1;
	Media media = 3;

  message Media {
    string storage_dir = 1;
    google.protobuf.Duration upload_idle_timeout = 2;
    google.protobuf.Duration transcode_timeout = 3;
    int64 max_upload_bytes = 4;
    int64 max_cover_bytes = 5;
  }
}

message Auth {
  string issuer = 1;
  string secret = 2;
  google.protobuf.Duration access_ttl = 3;
  google.protobuf.Duration refresh_ttl = 4;
}
