global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: mall
    scrape_timeout: 5s
    static_configs:
      - targets: ['mall:8001']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  # Docker Desktop reaches the isolated benchmark's published host port.
  # This target is intentionally down when the benchmark stack is stopped.
  - job_name: mall-bench
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['host.docker.internal:28001']
